# Runtime configuration for libbt-vendor (hardware/broadcom/libbt conf.c keys)
# Compile-time defaults live in libbt_vndcfg.txt

# UART device port where Bluetooth controller is attached
UartPort = /dev/ttyHS0

# Firmware patch file location
FwPatchFilePath = /vendor/firmware/

# Firmware patch settlement delay (ms)
FwPatchSettlementDelay = 100

# UART configuration
UartForceUse2StopBits = 1
